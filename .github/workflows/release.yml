# Builds the Setu binary (React app embedded) for linux/amd64 + linux/arm64 and publishes it.
#   push to main → GitHub release "edge" (pre-release, tag moved to the new commit, assets replaced)
#   tag v*       → normal release with generated notes (becomes /releases/latest = "stable" channel)
# Assets: setu-linux-amd64, setu-linux-arm64 and matching .sha256 files ("<hex>  <name>").
# Installed servers update from these assets (Platform console → Updates, or deploy/update.sh).
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="edge-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Setu $version ($GITHUB_SHA)"

      - name: Build web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx vite build --outDir ../server/internal/webui/dist --emptyOutDir

      - name: Build binaries
        working-directory: server
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p ../dist
          pkg=github.com/narendersinghh/setu/server/internal/buildinfo
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X $pkg.Version=$VERSION -X $pkg.Commit=$GITHUB_SHA" \
              -o ../dist/setu-linux-$arch ./cmd/setu
          done
          cd ../dist
          for f in setu-linux-amd64 setu-linux-arm64; do sha256sum "$f" > "$f.sha256"; done
          ls -l && cat ./*.sha256

      - name: Publish edge pre-release
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          notes="Automatic build of \`main\` at ${GITHUB_SHA} (version ${VERSION}). Not for production unless you chose the edge channel."
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "Edge ${VERSION}" --notes "$notes" --target "$GITHUB_SHA"
            gh release upload edge dist/setu-linux-* --clobber
          else
            gh release create edge dist/setu-linux-* --prerelease --title "Edge ${VERSION}" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/setu-linux-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/setu-linux-* --verify-tag --generate-notes --title "Setu $GITHUB_REF_NAME"
          fi
