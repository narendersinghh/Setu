# Tuned for a 4 vCPU / 8 GB VPS shared with the app. Scale shared_buffers ≈ 25% RAM, effective_cache_size ≈ 60%.
listen_addresses = '*'
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_compression = on
max_wal_size = 2GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
log_min_duration_statement = 500
log_lock_waits = on
idle_in_transaction_session_timeout = 60s
statement_timeout = 120s
